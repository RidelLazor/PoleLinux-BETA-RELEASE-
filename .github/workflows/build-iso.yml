name: Build PoleLinux ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate Plymouth assets
        run: |
          pip install Pillow
          python3 plymouth-theme/generate-assets.py

      - name: Build Docker image
        run: docker build -t polelinux-arch-builder .

      - name: Build ISO
        run: |
          docker run --rm --privileged --network=host \
            -v ${{ github.workspace }}:/build \
            -v /var/cache/pacman/pkg:/var/cache/pacman/pkg:ro \
            polelinux-arch-builder \
            bash -x /build/scripts/build-iso.sh 2>&1 | tee build.log

      - name: Verify ISO output
        run: |
          if [ ! -d build-env/out ]; then
            echo "build-env/out directory was not created. The ISO build likely failed."
            exit 1
          fi

          shopt -s nullglob
          iso_files=(build-env/out/*.iso)
          if [ ${#iso_files[@]} -eq 0 ]; then
            echo "No .iso files were generated in build-env/out/."
            exit 1
          fi

          ls -l "${iso_files[@]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polelinux-iso
          path: build-env/out/*.iso
          if-no-files-found: error
          retention-days: 30
