name: Build PoleLinux ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate Plymouth assets
        run: |
          pip install Pillow
          python3 plymouth-theme/generate-assets.py

      - name: Build Docker image
        run: docker build -t polelinux-arch-builder .

      - name: Build ISO
        run: |
          docker run --rm --privileged --network=host \
            -v ${{ github.workspace }}:/build \
            -v /var/cache/pacman/pkg:/var/cache/pacman/pkg:ro \
            polelinux-arch-builder \
            bash -x /build/scripts/build-iso.sh 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polelinux-iso
          path: build-env/out/*.iso
          retention-days: 30
